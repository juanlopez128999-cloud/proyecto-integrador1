<!doctype html>
<html lang="es" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyecto Integrador</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>


#carouselFullScreen {
    margin-top: 70px;
}

.carousel-item {
    position: relative;
}

.carousel-item img {
    width: 100%;
    height: calc(100vh - 70px);
    object-fit: contain;
    object-position: center;
    background-color: #ff0c6d;
}

.carousel-item::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.20);
    z-index: 5;
    pointer-events: none;
}

.carousel-caption {
    bottom: 15%;
    z-index: 20;
}

.carousel-caption h5 {
    font-size: 2.5rem;
    font-weight: 600;
    color: rgb(246, 4, 84);
    text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
}

.carousel-caption p {
    font-size: 1.2rem;
    color: rgb(223, 38, 66);
    text-shadow: 1px 1px 5px rgba(0,0,0,0.7);
}
/* NAVBAR NUEVO */
.navbar.navbar-rosa {
    background: #D90070 !important;
    height: 80px !important;
    padding: 0 50px !important;
    box-shadow: 0 4px 15px rgba(0,0,0,0.20) !important;
    z-index: 2000 !important;
}

.navbar-rosa .container-fluid {
    display: flex !important;
    align-items: center !important;
}

.navbar-rosa .navbar-brand {
    margin-right: auto !important;
}

.navbar-rosa .navbar-brand img {
    height: 90px !important;
    width: auto !important;
    max-width: 220px;
    object-fit: contain !important;
}
.navbar-rosa .navbar-nav {
    display: flex !important;
    align-items: center !important;
    gap: 20px !important;
}

.navbar-rosa .nav-link {
    color: white !important;
    font-size: 15px !important;
    font-weight: 600 !important;
    padding: 12px 22px !important;
    border-radius: 30px !important;
    transition: 0.3s !important;
}

.navbar-rosa .nav-link:hover {
    background: white !important;
    color: #D90070 !important;
}

.navbar-rosa .navbar-toggler {
    border: 1px solid white !important;
}

.navbar-rosa .navbar-toggler-icon {
    filter: brightness(0) invert(1);
}

@media (max-width: 991px) {
    .navbar.navbar-rosa {
        height: auto !important;
        padding: 10px 20px !important;
    }

    .navbar-rosa .navbar-collapse {
        background: #AD1457 !important;
        padding: 15px !important;
        border-radius: 12px !important;
        margin-top: 10px !important;
    }

    .navbar-rosa .navbar-nav {
        gap: 5px !important;
    }
}
/* BOTÓN INGRESAR DEL CARRUSEL */
.btn-custom {
    display: inline-block;
    background: #D90070;
    color: white;
    text-decoration: none;
    padding: 13px 38px;
    border-radius: 30px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 1px;
    border: 2px solid #D90070;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
    transition: all 0.3s ease;
}

.btn-custom:hover {
    background: white;
    color: #D90070;
    border-color: white;
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.30);
}

/* UBICACIÓN DEL TEXTO Y BOTÓN */
.carousel-caption {
    bottom: 15%;
    z-index: 20;
}

.carousel-caption .btn-custom {
    margin-top: 15px;
}
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg fixed-top navbar-rosa">
    <div class="container-fluid">

        <a class="navbar-brand" href="index.html">
            <img src="/img/logo.png" alt="Logo Biblioteca">
        </a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">INICIO</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="registro.html">INGRESAR</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contacto.html">CONTACTO</a>
                </li>
            </ul>
        </div>

    </div>
</nav>

<!-- Carrusel mostrando la imagen completa -->
<div id="carouselFullScreen" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="5000">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="/img/1.png" class="d-block w-100" style="height: 100vh; object-fit: contain; background-color:#8C7A6B;" alt="Biblioteca moderna con estudiantes revisando libros y laptops en mesas de trabajo iluminadas, en un ambiente tranquilo y enfocado para aprender y explorar recursos digitales">
      <div class="carousel-caption text-center">
        <h5>Explora nuestra biblioteca</h5>
        <p>Encuentra tu mundo en el que te gusta entrar</p>
              <a href="registro.html" class="btn-custom mt-3">Ingresar</a>
      </div>
    </div>
    <div class="carousel-item">
      <img src="/img/2.png" class="d-block w-100" style="height: 100vh; object-fit: contain; background-color:#8C7A6B;" alt="Persona concentrada aprendiendo frente a una computadora con materiales de estudio, en un espacio limpio y motivador para el crecimiento académico">
      <div class="carousel-caption text-center">
        <h5>Viaja sin límites</h5>
                     <p>Accede a cualquier libro.</p>
        <a href="registro.html" class="btn-custom mt-3">Ingresar</a>
      </div>
    </div>
    <div class="carousel-item">
      <img src="/img/3.png" class="d-block w-100" style="height: 100vh; object-fit: contain; background-color:#8C7A6B;" alt="Comunidad estudiantil reunida en un espacio colaborativo con libros y tecnología, rodeados de una atmósfera activa, cercana y alegre">
      <div class="carousel-caption text-center">
        <h5>Conéctate con tu libro</h5>
        <p>Participa en foros y proyectos colaborativos.</p>
        <a href="contacto.html" class="btn-custom mt-3">Contáctanos</a>
      </div>
    </div>
  </div>

  <!-- Controles -->
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselFullScreen" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
    <span class="visually-hidden">Anterior</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselFullScreen" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
    <span class="visually-hidden">Siguiente</span>
  </button>
</div>



  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script para cambiar color del nav al hacer scroll -->
  <script>
    window.addEventListener("scroll", function() {
      const nav = document.querySelector(".navbar");
      if (window.scrollY > 50) {
        nav.classList.add("scrolled");
      } else {
        nav.classList.remove("scrolled");
      }
    });
  </script>

</body>
</html>
