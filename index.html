
<!DOCTYPE html>
<html lang="es" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Proyecto Integrador | Biblioteca CESDE</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        /* CONFIGURACIÓN GENERAL */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            background: #8C7A6B;
        }

        /* NAVBAR */

        .navbar.navbar-rosa {
            background: rgba(217, 0, 112, 0.94) !important;
            height: 80px;
            padding: 0 50px;
            backdrop-filter: blur(15px);
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.18);
            transition: 0.4s ease;
            z-index: 2000;
        }

        .navbar.navbar-rosa.scrolled {
            background: rgba(120, 0, 60, 0.97) !important;
            height: 70px;
        }

        .navbar-rosa .navbar-brand img {
            height: 85px;
            max-width: 220px;
            object-fit: contain;
            transition: 0.3s;
        }

        .navbar-rosa .navbar-brand img:hover {
            transform: scale(1.06);
        }

        .navbar-rosa .navbar-nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .navbar-rosa .nav-link {
            color: white !important;
            font-size: 15px;
            font-weight: 600;
            padding: 12px 22px !important;
            border-radius: 30px;
            transition: 0.3s;
        }

        .navbar-rosa .nav-link:hover {
            background: white !important;
            color: #D90070 !important;
            transform: translateY(-3px);
        }

        .navbar-toggler {
            border: 1px solid white !important;
        }

        .navbar-toggler-icon {
            filter: brightness(0) invert(1);
        }

        /* CARRUSEL */

        #carouselFullScreen {
            margin-top: 80px;
        }

        .carousel-item {
            position: relative;
            height: calc(100vh - 80px);
            min-height: 500px;
            background: #8C7A6B;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            background-color: #8C7A6B;
        }

        /* CAPA DEGRADADA */

        .carousel-item::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                rgba(0, 0, 0, 0.55),
                rgba(0, 0, 0, 0.12),
                transparent
            );
            z-index: 5;
            pointer-events: none;
        }

        /* TEXTO DEL CARRUSEL */

        .carousel-caption {
            bottom: 17%;
            z-index: 20;
            text-align: center;
        }

        .carousel-caption h5 {
            font-size: clamp(28px, 4vw, 48px);
            font-weight: 700;
            color: white;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
            letter-spacing: 1px;
        }

        .carousel-caption p {
            font-size: clamp(15px, 2vw, 21px);
            color: white;
            font-weight: 500;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.8);
        }

        /* ANIMACIÓN */

        .carousel-item.active .carousel-caption {
            animation: aparecer 0.8s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* BOTÓN PERSONALIZADO */

        .btn-custom {
            display: inline-block;
            background: linear-gradient(135deg, #D90070, #ff4da6);
            color: white;
            text-decoration: none;
            padding: 14px 38px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(217, 0, 112, 0.4);
            transition: all 0.35s ease;
        }

        .btn-custom:hover {
            background: white;
            color: #D90070;
            transform: translateY(-5px) scale(1.04);
            box-shadow: 0 12px 30px rgba(217, 0, 112, 0.5);
        }

        /* FLECHAS */

        .carousel-control-prev,
        .carousel-control-next {
            z-index: 15;
            width: 8%;
        }

        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            background-color: #D90070;
            border-radius: 50%;
            padding: 25px;
            background-size: 45%;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        /* INDICADORES */

        .carousel-indicators {
            z-index: 25;
            margin-bottom: 20px;
            gap: 8px;
        }

        .carousel-indicators button {
            width: 35px;
            height: 5px;
            border-radius: 20px;
            border: none;
            transition: 0.4s;
        }

        .carousel-indicators .active {
            width: 60px;
            background-color: #ff4da6;
        }

        /* RESPONSIVE TABLETS */

        @media (max-width: 991px) {

            .navbar.navbar-rosa {
                height: auto;
                padding: 10px 20px;
            }

            .navbar-rosa .navbar-collapse {
                background: #AD1457;
                padding: 15px;
                border-radius: 15px;
                margin-top: 10px;
            }

            .navbar-rosa .navbar-nav {
                gap: 5px;
            }

            .navbar-rosa .navbar-brand img {
                height: 65px;
            }

        }

        /* RESPONSIVE CELULARES */

        @media (max-width: 576px) {

            .carousel-item {
                height: calc(100vh - 80px);
                min-height: 550px;
            }

            .carousel-caption {
                bottom: 15%;
            }

            .carousel-caption h5 {
                font-size: 27px;
            }

            .carousel-caption p {
                font-size: 14px;
            }

            .carousel-item img {
                object-fit: contain;
            }

            .btn-custom {
                padding: 13px 28px;
                font-size: 14px;
            }

        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg fixed-top navbar-rosa">

        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                <img src="/img/logo.png" alt="Logo Biblioteca">
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Abrir menú">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">Contacto</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="registro.html">Ingresar</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- CARRUSEL ORIGINAL -->

    <div id="carouselFullScreen"
        class="carousel slide carousel-fade"
        data-bs-ride="carousel"
        data-bs-interval="5000">

        <!-- INDICADORES -->

        <div class="carousel-indicators">

            <button type="button"
                data-bs-target="#carouselFullScreen"
                data-bs-slide-to="0"
                class="active"
                aria-current="true"
                aria-label="Imagen 1">
            </button>

            <button type="button"
                data-bs-target="#carouselFullScreen"
                data-bs-slide-to="1"
                aria-label="Imagen 2">
            </button>

            <button type="button"
                data-bs-target="#carouselFullScreen"
                data-bs-slide-to="2"
                aria-label="Imagen 3">
            </button>

        </div>


        <!-- IMÁGENES -->

        <div class="carousel-inner">

            <!-- IMAGEN 1 -->

            <div class="carousel-item active">

                <img src="/img/1.png"
                    class="d-block w-100"
                    alt="Biblioteca moderna con estudiantes">

                <div class="carousel-caption text-center">

                    <h5>Biblioteca Inteligente</h5>

                    <p>Encuentra tu mundo en el que te gusta entrar.</p>

                    <a href="registro.html" class="btn-custom mt-3">
                        Ingresar
                    </a>

                </div>

            </div>


            <!-- IMAGEN 2 -->

            <div class="carousel-item">

                <img src="/img/2.png"
                    class="d-block w-100"
                    alt="Persona aprendiendo frente a una computadora">

                <div class="carousel-caption text-center">

                    <h5>Explora nuevos conocimientos</h5>

                    <p>Accede a cualquier libro.</p>

                    <a href="registro.html" class="btn-custom mt-3">
                        Ingresar
                    </a>

                </div>

            </div>


            <!-- IMAGEN 3 -->

            <div class="carousel-item">

                <img src="/img/3.png"
                    class="d-block w-100"
                    alt="Comunidad estudiantil trabajando en equipo">

                <div class="carousel-caption text-center">

                    <h5>Aprendemos juntos</h5>

                    <p>Participa en foros y proyectos colaborativos.</p>

                    <a href="contacto.html" class="btn-custom mt-3">
                        Contáctanos
                    </a>

                </div>

            </div>

        </div>


        <!-- BOTÓN ANTERIOR -->

        <button class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselFullScreen"
            data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

            <span class="visually-hidden">Anterior</span>

        </button>


        <!-- BOTÓN SIGUIENTE -->

        <button class="carousel-control-next"
            type="button"
            data-bs-target="#carouselFullScreen"
            data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

            <span class="visually-hidden">Siguiente</span>

        </button>

    </div>


    <!-- BOOTSTRAP JAVASCRIPT -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


    <script>

        window.addEventListener("scroll", function () {

            const nav = document.querySelector(".navbar");

            if (window.scrollY > 50) {
                nav.classList.add("scrolled");
            } else {
                nav.classList.remove("scrolled");
            }

        });

    </script>

</body>

</html>
