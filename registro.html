
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #8C7A6B;
    }

    .form-container {
      max-width: 400px;
      padding: 2rem;
      background: #FFFFFF;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .custom-btn {
      background: #AFAFAF;
      color: #FFFFFF;
      border: none;
    }

    .custom-btn:hover {
      background: #8C7A6B;
    }
  </style>
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

  <main class="form-container text-center">

    <h1 class="h4 mb-3">Crear cuenta</h1>

    <form id="registroForm">

      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="regEmail" placeholder="Correo electrónico" required>
        <label for="regEmail">Correo electrónico</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="regPassword" placeholder="Contraseña" required>
        <label for="regPassword">Contraseña</label>
      </div>

      <button type="submit" class="btn w-100 py-2 custom-btn">
        Registrarse
      </button>

      <div class="mt-3">
        <a href="index.html">← Volver al login</a>
      </div>

    </form>

  </main>

<script>
document.getElementById("registroForm").addEventListener("submit", function(e) {

  e.preventDefault();

  const email = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value.trim();

  if (email === "" || password === "") {
    alert("Completa todos los campos");
    return;
  }

  localStorage.setItem("usuario", email);
  localStorage.setItem("clave", password);

  alert("Cuenta creada correctamente");

  window.location.href = "rol.html";

});
</script>

</body>
</html>
