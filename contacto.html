<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: #8C7A6B; /* Fondo */
    color: #000000; /* Texto principal */
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    background: #D8CFC4; /* Header */
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.logo img {
    height: 120px;
}

.nav a {
    margin-left: 25px;
    text-decoration: none;
    color: #000000;
    font-weight: 600;
    position: relative;
}

.nav a::after {
    content: "";
    position: absolute;
    width: 0%;
    height: 2px;
    background: #FFFFFF;
    left: 0;
    bottom: -5px;
    transition: 0.3s;
}

.nav a:hover {
    color: #FFFFFF;
}

.nav a:hover::after {
    width: 100%;
}

/* HERO */
.hero {
    height: 45vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(to right, #D8CFC4, #8C7A6B);
    color: #FFFFFF;
}

.hero h1 {
    font-size: 2.5rem;
}

/* CONTENEDOR */
.contacto-contenido {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 40px;
    padding: 60px 20px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
}

/* MAPA */
.mapa-card {
    flex: 1;
    min-width: 320px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(10px);
    padding: 15px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.4);
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    position: relative;
    z-index: 2;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
}

.mapa-card:hover {
    transform: translateY(-12px);
    z-index: 10;
    box-shadow: 0 25px 60px rgba(0,0,0,0.18);
}

.mapa iframe {
    width: 100%;
    height: 380px;
    border: 0;
    border-radius: 15px;
}

/* FORM */
.form-box {
    flex: 1;
    min-width: 320px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.4);
    box-shadow: 0 10px 25px rgba(0,0,0,0.10);
    position: relative;
    z-index: 2;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
}

.form-box:hover {
    transform: translateY(-12px);
    z-index: 10;
    box-shadow: 0 25px 60px rgba(0,0,0,0.18);
}

.form-box h2 {
    margin-bottom: 20px;
    text-align: center;
}

.form-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 15px;
}

.form-group label {
    margin-bottom: 5px;
    font-weight: 600;
}

.form-group input,
.form-group textarea {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    outline: none;
    font-family: 'Inter', sans-serif;
    background: #FFFFFF;
    color: #000000;
}

.form-group textarea {
    resize: none;
    height: 120px;
}

.btn {
    background: #AFAFAF; /* Main */
    color: #FFFFFF;
    padding: 12px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    width: 100%;
    transition: 0.3s;
}

.btn:hover {
    background: #8C7A6B;
}

/* REDES */
.redes {
    width: 100%;
    text-align: center;
    padding: 30px 0 10px;
}

.social-icons {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 15px;
}

.social {
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #AFAFAF;
    color: #FFFFFF;
    font-size: 22px;
    transition: 0.3s;
    text-decoration: none;
}

.social:hover {
    transform: translateY(-5px) scale(1.05);
    background: #8C7A6B;
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 20px;
    background: #000000; /* Footer */
    color: #FFFFFF;
}

/* RESPONSIVE */
@media (max-width: 900px) {
    .contacto-contenido {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">
        <img src="img/logo.png" alt="Logo">
    </div>

    <nav class="nav">
        
        <a href="index.html">Inicio</a>

    </nav>
</header>

<section class="hero">
    <h1>Contáctanos</h1>
</section>

<section class="contacto-contenido">

    <!-- MAPA -->
    <div class="mapa-card">
        <div class="mapa">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3087.667063534447!2d-75.54796442633499!3d6.33805679365165!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e442f997ee18601%3A0xb05c41e43af38f9d!2sDg.%2050A%20%2338%2020%2C%20Hermosa%20Provincia%2C%20Medell%C3%ADn%2C%20Bello%2C%20Antioquia!5e1!3m2!1ses-419!2sco!4v1779458759146!5m2!1ses-419!2sco"
            loading="lazy"></iframe>
        </div>
    </div>

    <!-- FORM -->
    <div class="form-box">
        <h2>Envíanos un mensaje</h2>

        <form>
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" placeholder="Tu nombre">
            </div>

            <div class="form-group">
                <label>Correo</label>
                <input type="email" placeholder="Tu correo">
            </div>

            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" placeholder="Tu número">
            </div>

            <div class="form-group">
                <label>Mensaje</label>
                <textarea placeholder="Escribe tu mensaje..."></textarea>
            </div>

            <button class="btn">Enviar mensaje</button>
        </form>
    </div>

</section>

<!-- REDES -->
<section class="redes">
    <h2>Síguenos</h2>

    <div class="social-icons">
        <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="social"><i class="fab fa-whatsapp"></i></a>
        <a href="#" class="social"><i class="fab fa-instagram"></i></a>
    </div>
</section>

<footer class="footer">
    <p>© 2026 - Todos los derechos reservados</p>
</footer>

</body>
</html>
